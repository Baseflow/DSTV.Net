name: Build and Unit Test Dstv reader

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build_test_dstv_net:
    runs-on: ubuntu-latest
    steps:

      - name: Check SonarCloud configuration
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache SonarCloud packages
        if: steps.sonar.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanners
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        if: steps.sonar.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"Baseflow_DSTV.Net" /o:"baseflow" /d:sonar.login="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build
          dotnet-sonarscanner end /d:sonar.login="$SONAR_TOKEN"

      - name: Restore dependencies
        run: dotnet restore DSTV.Net.sln
      - name: Build
        run: dotnet build DSTV.Net.sln --no-restore
      - name: Verify .NET Standard build
        run: |
          dotnet build DSTV.Net/DSTV.Net.csproj --framework netstandard2.0 --no-restore
          dotnet build DSTV.Net.Json/DSTV.Net.Json.csproj --framework netstandard2.0 --no-restore
      - name: Test
        run: dotnet test DSTV.Net.sln --no-build --verbosity normal
